# /run/mosdns and the two state directories' leftovers.
#
# This file exists because of one fact about /run: it is a tmpfs. Everything
# postinst sets on /run/mosdns -- the group, the setgid bit and the default ACL --
# is gone after the next reboot, and nothing in a package's postinst can bring it
# back. So the same properties are declared here, and systemd-tmpfiles applies them
# on every boot.
#
# /run/mosdns is where the NetworkManager dispatcher publishes the DHCP generation
# the router reads. It has no producer unit and no ordering edge: the dispatcher
# creates it asynchronously, the router treats its absence as "keep the current
# generation" and starts green, and a unit directive cannot say that honestly
# because ConditionPathExists would make the only resolver on the machine refuse to
# start before the first dispatch. A missing directory is therefore the normal
# state of a machine whose dispatcher has not fired, and this entry is the whole of
# the guarantee that the directory is there when one does.
#
# 2770 and not 2750, and the reason is not tidiness. Both the router (user
# mosdns-router) and the bridge and the optimizer (user mosdns-router-cdn) are in
# the group, and both
# have to create and rename files in here. A member of a root:mosdns-router
# directory's own group cannot create a file in it at all at 2750 -- measured on the
# system-level test machine, not reasoned about -- and it can at 2770. There is no
# third option,
# because when a directory carries an extended ACL the mode's group field IS the
# group-class mask, so 2750 caps the group at r-x and the default ACL below cannot
# restore what the mask removed.
#
# The ACL line carries BOTH an access and a default group entry, and the default one
# `default:other::` is the property this whole entry exists for: the plan's own
# correction is that the reverse of the two steps leaves `other::r-x` and a
# directory neither service identity can write.
#
# The default entry is the reason two service identities can share this directory. A default ACL
# grants the NEW FILE its permissions; it grants the directory nothing. A file
# created by one identity is group-writable for the other because the directory
# carries a default entry, and it lands in this group because the directory is
# setgid.
#
# The COMMA between the two ACL entries is not a typo and is not optional. Measured
# on the system-level test machine with systemd 255: `g::rwx d:g::rwx` is parsed as
# ONE entry, acl_from_text refuses it, and systemd prints
#     Failed to parse ACL "g::rwx d:g::rwx", ignoring: Invalid argument
# and CARRIES ON. A space-separated spec therefore ships an entry that looks right,
# passes every test that reads the text, and creates the directory with no ACL at
# all. `parse_acl` splits the specification on commas.
#
# Measured result of the two lines above, on 24.04 with a real `systemd-tmpfiles`:
#
#     drwxrws--- root:mosdns-router /run/mosdns
#     user::rwx  group::rwx  other::---
#     default:user::rwx  default:group::rwx  default:other::---
#
# and a file created in it comes out `-rw-rw---- root:mosdns-router`. The
# is the property this whole entry exists for: the plan's own correction is that the
# reverse of the two steps leaves `other::r-x` and a directory neither service
# identity can write.
#
# The reap lines at the end are the producers' staging leftovers. Every publisher in
# this project stages a file beside its target, flushes it, and renames it into
# place; a publication that dies between the staging and the rename leaves a file
# behind, and state nothing manages. FOUR producers do it, in three directories:
# internal/state/atomic.go and internal/rules/publish.go for the runtime directory,
# cmd/mosdns-cdnctl/publish.go for /etc/mosdns -- which is why a generated document
# directory needs reaping at all -- and internal/candidate for /var/lib/mosdns/lists.
# Nothing outside those directories is reaped: a reap line is a delete.
#
# internal/candidate is the FOURTH producer and the only one that needs its own two
# patterns, because it is the only one that names its staged file NEITHER with a
# leading dot NOR with a .tmp suffix. Where the other three call
# `os.CreateTemp(dir, "."+base+".*.tmp")`, it calls
# `os.CreateTemp(directory, filepath.Base(path)+".*")` -- internal/candidate/prefixes.go
# for cloudflare-prefixes.txt and internal/candidate/fetch.go for
# cloudflare-ips.json -- so what it leaves behind in /var/lib/mosdns/lists is
# `cloudflare-prefixes.txt.1234567`. Neither `*.tmp` nor `.*.tmp` names that shape, and
# before these two lines the lists directory was not reaped at all, so a publication
# interrupted between the staging and the rename left a file nothing would ever
# remove.
#
# The two patterns are as narrow as they can be, and that is the whole constraint:
# a reap line is a DELETE, and the two published files in that directory are
# `cloudflare-prefixes.txt` and `cloudflare-ips.json` themselves. `cloudflare-*.json.*`
# or a glob over the whole directory would also match those, so the name, the exact
# directory and the trailing `.*` are all load-bearing.
#
# Each of the two suffixes appears TWICE, and the dotted form is the one that does
# the work. The publishers name their temporary files with a leading dot --
# `os.CreateTemp(dir, "."+base+".*.tmp")`, so a staged mosdns.yaml is
# `.mosdns.yaml.123456789.tmp` -- and a `*` does not match a leading dot. Measured on
# the system-level test machine: with `r .../*.tmp` alone, a planted
# `mosdns.yaml.abc.tmp` is reaped and a planted `.mosdns.yaml.abc.tmp` is not, so the
# entry would have reaped nothing this project produces. With the dotted form added,
# both go and the directories stay: `r` removes regular files, and `.*` matching `.`
# and `..` is therefore harmless.
#
# These lines are honoured by `systemd-tmpfiles --remove`, which
# systemd-tmpfiles-setup.service runs at boot together with --create and --clean.
# `--create` alone does not touch them, which is worth knowing when reading a test
# that appears to show the entry reaping nothing.

d /run/mosdns 2770 root mosdns-router -
a /run/mosdns - - - - g::rwx,d:g::rwx

# THE RESOLVER WATCHDOG'S RECORD, in a directory of its own, and this is the ONE
# directory in this file that is not 2770 root:mosdns-router with a default ACL.
#
# It has to be different, and the reason is a privilege rather than a preference.
# `mosdns-router-cdn` -- the identity the health check and the optimizer run as --
# is in the `mosdns-router` group, and the directory above gives that group `w`.
# A `0600` file
# inside a group-WRITABLE directory is still deletable and still replaceable:
# unlink and rename are decided by the containing directory, not by the file's
# own mode. So in `/run/mosdns` itself, `mosdns-router-cdn` could delete
# `watchdog.json` -- switching off the only automatic DNS protection on the
# machine, silently -- or replace it with a document claiming a threshold of 99
# and a first failure long past, so that the next run tore the machine down with
# no window in front of it. Neither is possible here: this directory is 0700
# root:root, the watchdog runs as root, and no other identity in this package
# reads the record.
#
# It is a subdirectory rather than a change to `/run/mosdns` because the 2770
# above is not an accident and nothing here outranks the measurement behind it:
# `mosdns_dhcp_bridge` publishes `dhcp-upstreams.json` as `mosdns-router-cdn` and needs
# directory `w` to do it. The bridge's published state and the watchdog's record
# are two different things that happen to share a parent, and only one of them has
# an unprivileged writer.
#
# 0700 and not 0750: unlike `/run/mosdns`, nothing here is read by any other
# identity, so the group needs no access at all -- not to the file and not to the
# entry that could be deleted or renamed in its place.
d /run/mosdns/watchdog 0700 root root -

# ...and the reap lines for it, which the parent does NOT cover. The two patterns
# above name /run/mosdns directly and a tmpfiles `r` line is not recursive, so a
# publication interrupted between staging and rename inside /run/mosdns/watchdog
# would leave a file nothing collects. The same two patterns, for the same
# reason, and the staged name is `.watchdog.json.<pid>.tmp` -- a leading dot,
# which is why the dotted form is not optional here either.
r /run/mosdns/watchdog/*.tmp
r /run/mosdns/watchdog/.*.tmp

r /run/mosdns/*.tmp
r /run/mosdns/.*.tmp
r /run/mosdns/*.bak
r /run/mosdns/.*.bak
r /var/lib/mosdns/runtime/*.tmp
r /var/lib/mosdns/runtime/.*.tmp
r /var/lib/mosdns/runtime/*.bak
r /var/lib/mosdns/runtime/.*.bak
r /etc/mosdns/*.tmp
r /etc/mosdns/.*.tmp
r /etc/mosdns/*.bak
r /etc/mosdns/.*.bak
r /var/lib/mosdns/lists/cloudflare-prefixes.txt.*
r /var/lib/mosdns/lists/cloudflare-ips.json.*
