# mosdns-router routing configuration for MOSDNS v5.3.4.
#
# Generated by internal/mosdnsconfig.Render from the policy at /etc/mosdns/policy.yaml.
# Edit the policy or the paths, not this file: configs/mosdns.yaml is the
# committed output of Render(config.Defaults(), ProductionPaths()) and a test
# compares the two byte for byte, so a hand edit here is an edit the project
# stops being able to explain.
#
# Two branches and no third. A name the pinned China list matches goes to the
# DNS servers DHCP published, and every other name goes to the loopback DNSCrypt
# resolver over TCP. There is no fallback between them: a foreign query that
# cannot be answered fails, and is never re-asked inside the network the user is
# leaving.
log:
  level: info
plugins:
  - tag: cn_domains
    type: domain_set
    args:
      files:
        - /var/lib/mosdns/lists/cn-domains.txt
  - tag: dhcp_forward
    type: dhcp_forward
    args:
      state_file: /run/mosdns/dhcp-upstreams.json
      cache_entries: 4096
      upstream_port: 53
      failure_policy: disable-current
  - tag: foreign_cache
    type: cache
    args:
      size: 1024
  - tag: foreign_forward
    type: forward
    args:
      upstreams:
        - addr: tcp://127.0.0.1:15353
  - tag: cn_path
    type: sequence
    args:
      - exec: $dhcp_forward
      - exec: accept
  - tag: foreign_path
    type: sequence
    args:
      - exec: $foreign_cache
      - matches:
          - has_resp
        exec: accept
      - exec: $foreign_forward
      - exec: accept
  - tag: main
    type: sequence
    args:
      - matches:
          - qname $cn_domains
        exec: goto cn_path
      - exec: goto foreign_path
  - tag: udp_server
    type: udp_server
    args:
      entry: main
      listen: 127.0.0.1:53
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main
      listen: 127.0.0.1:53
