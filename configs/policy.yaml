# mosdns-router default policy.
#
# Generated by config.Marshal from config.Defaults(): configs/policy.yaml is the
# committed output of Marshal(Defaults()) and a test compares the two byte for
# byte, so a hand edit here is an edit the project stops being able to explain.
# Change Defaults(), or render a policy of your own somewhere else.
schema_version: 1
schedule: "03:00"
foreign:
  default_provider: Quad9 Secure DNSCrypt v2
  ecs: false
  concurrent: 2
  upstreams:
    - kind: dnscrypt
      name: quad9-dnscrypt
    - kind: upstream
      name: quad9-doq
      addr: quic://dns.quad9.net:853
      bootstrap:
        - 9.9.9.9:53
cdn:
  ip_version: IPv4
  suppress_aaaa: true
  cloudflare:
    max_candidates: 512
  latency_candidate_count: 10
  combined:
    latency_top: 3
    bandwidth_top: 3
  switch_improvement_percent: 10
  health:
    interval: 120
    failure_threshold: 3
  bandwidth:
    daily_budget: 104857600
    per_candidate_limit: 10485760
    per_candidate_seconds: 3
ech:
  enabled: true
  failure_policy: strict
  stale_grace: 600
  sources:
    - cloudflare-ech.com
    - crypto.cloudflare.com
    - discordapp.com
    - cdn.discordapp.com
    - encryptedsni.com
    - www.encryptedsni.com
    - ech.encryptedsni.com
    - api.encryptedsni.com
    - mail.encryptedsni.com
dhcp:
  failure_policy: disable-current
cache:
  persistent_dump: false
foreign_cache:
  size: 1024
  ttl_max: 0
  ttl_min: 0
