# PUBLISHES A BUILT PACKAGE AS A RELEASE.
#
# This is the step that was missing, and its absence is why build-deb.yml used to do
# it too. Publishing has to be a CHOICE made about a build somebody looked at, and
# "build and publish in one run" cannot express that: the Release was whatever the
# last run produced, and there was no moment at which a person decided.
#
# So this workflow builds nothing. It takes the ID of a build run, downloads THAT
# run's artifact, and publishes it. Three consequences worth stating:
#
#   - The choice is an argument. "Promote run 37211000000" is a decision somebody
#     made; the build workflow publishing itself was not.
#   - This run appears in the Actions list, so the publishing is as visible and as
#     auditable as the building. There is no path to a Release that is not a run.
#   - It does NOT rebuild. A Release built from a fresh compile is not the package
#     you chose, it is a different package that happens to come from the same commit
#     -- BUILD_TIME goes into the linker, so two builds of one commit differ. It
#     downloads the artifact and re-checks it.
#
# It re-runs scripts/assert-deb.sh rather than trusting the build run. The build run
# ran the same script, but a run that asserts nothing about what it is about to
# publish is a run that republishes whatever it was handed.

name: publish-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The build-deb run whose artifact to publish (from its URL)"
        required: true
        type: string
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true
        type: string

# NO workflow-level permissions on purpose. The two jobs need DISJOINT scopes -- one
# reads an artifact, the other writes a Release -- and this repository's GITHUB_TOKEN
# answered `403 Resource not accessible by integration` on the releases API while it
# could read that same list. A workflow-level block declaring `contents: write` plus
# `actions: read` was not honoured; the run that did create a release had
# `contents: write` alone. Rather than keep guessing which scope offended it, each
# scope now goes to the one job that needs it, which is the smaller permission surface
# anyway: the job that downloads an artifact cannot create a tag, and the job that
# creates a tag cannot read artifacts from other runs.
jobs:
  fetch:
    name: fetch the built package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.read.outputs.revision }}
    steps:
      - name: the source, and its tags
        uses: actions/checkout@v5
        with:
          # Full history because the tag this creates has to point at a commit, and
          # a commit the artifact records. A shallow clone cannot resolve either.
          fetch-depth: 0

      - name: the built package, from that run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          if ! gh run download "$RUN_ID" --repo "$REPO" --name mosdns-router-deb --dir pkg; then
            echo "No mosdns-router-deb artifact on run ${RUN_ID}." >&2
            echo "Check the run id, and check that the run SUCCEEDED -- a failed" >&2
            echo "build uploads nothing to promote." >&2
            exit 1
          fi
          find pkg -name '*.deb' -type f

      - name: re-upload it as this run's own artifact
        # The next job cannot read another run's artifacts -- that is `actions: read`
        # and this job deliberately does not have write, so it cannot be the one that
        # creates the Release. Handing the bytes over as an artifact of THIS run is how
        # the two disjoint scopes meet, and it copies rather than rebuilds: the package
        # promoted is the package the chosen run produced.
        uses: actions/upload-artifact@v7
        with:
          name: fetched
          path: pkg/*.deb
          if-no-files-found: error

  publish:
    name: publish a built package
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: the source, and its tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: the package the fetch job brought
        uses: actions/download-artifact@v6
        with:
          name: fetched
          path: pkg

      - name: the same assertions the build ran
        # Not a formality. The point of promoting a chosen artifact is that it is the
        # package that was inspected, so it is re-checked here against the same script,
        # from the repository at the tag's commit. And it is re-checked in THIS job
        # because this job is the one about to make the bytes installable by somebody.
        run: |
          set -euo pipefail
          deb=$(find pkg -name '*.deb' -type f | head -1)
          test -n "$deb"
          sh scripts/assert-deb.sh "$deb"
          sha256sum "$deb"
          dpkg-deb --info "$deb" | sed -n '1,12p'

      - name: publish it, or refuse to
        # EVERY variable the notes template interpolates has to be here. `env:` is
        # per-step, not per-job: RUN_ID lived only on the download step, and the
        # notes template reads ${RUN_ID}, so the publish step died on
        # "RUN_ID: unbound variable" under `set -u` -- after downloading, after
        # asserting, and after spending a runner on it. The value is repeated here
        # rather than promoted to the job's env because a step that names what it
        # reads is easier to check against what the step does.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          # github.run_id, not github.job.run_id: the latter is not a valid context
          # property and rendered EMPTY, which put a bare ".../actions/runs/" in the
          # release notes -- a link to the list rather than to the run.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
        run: |
          set -euo pipefail
          deb=$(find pkg -name '*.deb' -type f | head -1)
          want=$(sed -n 's/^PACKAGE_VERSION=//p' scripts/build-deb.sh)
          sha=$(sha256sum "$deb" | cut -d' ' -f1)
          rev=$(sh scripts/assert-deb.sh "$deb" | tail -1)
          test -n "$rev" -a -n "$sha" -a -n "$want"

          # The tag and the package version are one fact, not two conventions that
          # happen to agree. A release tagged v0.2.1 carrying a package whose control
          # field says 0.2.0 is a trap for whoever installs it next, and the check
          # costs one line. PACKAGE_VERSION is what the package says; the tag is
          # what somebody typed; this makes the second one answer to the first.
          if [ "$TAG" != "v${want}" ]; then
            echo "This package's version is ${want}, so its release tag is v${want}," >&2
            echo "not ${TAG}. Either use v${want}, or change PACKAGE_VERSION in" >&2
            echo "scripts/build-deb.sh and rebuild -- a tag is a claim about which" >&2
            echo "version this is, and it should not be able to disagree with the" >&2
            echo "package it names." >&2
            exit 1
          fi

          # A Release is a claim about one commit, and the commit is the one the
          # PACKAGE was built from -- not the branch head, which may have moved on
          # since the build ran. So the tag is created at the artifact's revision,
          # and that is checked rather than assumed.
          git fetch -q origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tagged=$(git rev-list -n1 "refs/tags/${TAG}")
            if [ "$tagged" != "$rev" ]; then
              echo "tag ${TAG} names ${tagged}, and this package was built from ${rev}." >&2
              echo "Refusing to move a tag a Release may already point at, and" >&2
              echo "refusing to publish one package under another commit's tag." >&2
              echo "Use a new tag, or promote the build of ${tagged}." >&2
              exit 1
            fi
            echo "tag ${TAG} already names this commit."
          fi

          notes=$(cat <<TXT
          Promoted from [build run ${RUN_ID}](${SOURCE_RUN_URL}) by
          [this workflow](${RUN_URL}), which built nothing and re-checked
          everything: the assertions in \`scripts/assert-deb.sh\` ran against the
          downloaded artifact, so this is the package that run produced and not a
          fresh compile of the same commit.

          | | |
          |---|---|
          | Version | \`${want}\` |
          | Architecture | \`amd64\` |
          | Built from | \`${rev}\` |
          | sha256 | \`${sha}\` |

          The sha256 above is of the file behind the link below. Re-running the
          build produces different bytes -- \`BUILD_TIME\` goes into the linker -- so
          compare against the notes, never against an older build of the same commit.

          ### Before installing it

          This package takes the machine's DNS over: it points NetworkManager at
          \`127.0.0.1:53\`. Install it on a VM or a disposable machine, not on the
          one whose only remote access depends on working DNS.

          \`dpkg -i\` leaves the package **half-configured** when \`postinst\` refuses
          the transaction, which is a normal outcome rather than a broken package.
          If you see it, do NOT run \`dpkg --configure mosdns-router\` -- that retries
          the transaction while DNS may already point at a resolver that is not
          running. \`mosdns-cdnctl emergency-rollback\` restores DNS, does not consult
          the preflight, and works on exactly the machine whose install died.

          ### Verifying it did what it claims

          A name resolving does not prove it took the foreign branch -- the domestic
          resolver answers the same names. The decisive check is to break the foreign
          leg and watch the domestic one keep working, with the watchdog stopped
          first so it does not roll the machine back mid-test:

              sudo systemctl stop mosdns-watchdog.timer mosdns-watchdog.service
              sudo systemctl stop dnscrypt-proxy
              dig +short @127.0.0.1 -p 53 www.google.com   # timeout or SERVFAIL
              dig +short @127.0.0.1 -p 53 baidu.com        # still answers
              sudo systemctl start dnscrypt-proxy
          TXT
          )
          notes=$(printf '%s\n' "$notes" | sed 's/^          //')

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Same immutability rule as before, on the same reasoning: a Release is
            # fixed per commit. Re-publishing the same commit would replace the asset
            # with different bytes and leave these notes quoting a file that is gone,
            # and a checksum that stops matching is worse than no checksum.
            existing=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body' \
              | sed -n 's/^| Built from | `\([0-9a-f]*\)` |$/\1/p' | head -1)
            if [ "$existing" = "$rev" ]; then
              echo "Release ${TAG} already publishes ${rev:0:12}; nothing to do."
            else
              echo "Release ${TAG} publishes ${existing:-an unknown commit}; replacing asset AND notes."
              gh release upload "$TAG" "$deb" --repo "$REPO" --clobber
              gh release edit "$TAG" --repo "$REPO" --notes "$notes"
            fi
          else
            gh release create "$TAG" "$deb" --repo "$REPO" --target "$rev" \
              --title "mosdns-router ${want}" --notes "$notes"
          fi

          echo "--- ${TAG}"
          gh release view "$TAG" --repo "$REPO" --json url --jq '.url'
          echo "download: https://github.com/${REPO}/releases/download/${TAG}/$(basename "$deb")"