# Builds the Debian package on GitHub's own runners and uploads it as an artifact.
#
# WHY A WORKFLOW FOR SOMETHING `scripts/build-deb.sh` ALREADY DOES: this machine is
# not the machine the package is tested on, and a package that only one machine can
# produce is a package only one machine can vouch for. The build itself is the same
# script, with the same pinned Go, the same pinned dnscrypt-proxy archive digest and
# the same `--root-owner-group` no-root rule; nothing here is a second build path.
#
# WHAT THIS IS NOT: it does not test the package. `make verify` is the project's
# gate, and it is deliberately not run here -- `test-installer` has a pre-existing
# failure that asserts one systemd version and this runner carries another, and a
# red workflow that a known-bad assertion caused teaches the reader to ignore red.
# The gates below are the ones measured green on a clean checkout.

# BUILDS THE PACKAGE. It does not publish one.
#
# WHY THERE IS A SEPARATE WORKFLOW FOR PUBLISHING: a Release is a choice, and this
# workflow had no way to express "I built it, now look at it". It built AND
# published in the same run, so the Release was whatever the last run produced --
# there was no point at which a person looked at a build and decided. Publishing is
# `publish-release.yml`, which takes a build run by id, so the selection is an
# explicit argument and it appears in this repository's Actions list like anything
# else.
#
# So this workflow's only outputs are a run and a zip. It creates no tag, no
# Release, and nothing outside its own run.

name: build-deb

on:
  # On demand only. A tag push deliberately does NOT trigger this: a tag is a
  # publishing decision, and a build that fires because somebody tagged would put a
  # package in front of a release nobody chose.
  workflow_dispatch:

permissions:
  # Read is all a build needs. `contents: write` moved to publish-release.yml, which
  # is the only thing here that should be able to create a tag or a Release.
  contents: read

jobs:
  deb:
    name: the package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: the source, and its tags
        uses: actions/checkout@v5
        with:
          # scripts/build-deb.sh puts `git describe --tags --always` into the
          # binary's build identity. A shallow checkout has no tags, so that would
          # silently become a bare short SHA and every build would claim to be the
          # same anonymous revision.
          fetch-depth: 0

      - name: the pinned Go
        uses: actions/setup-go@v6
        with:
          # go.mod carries `go 1.25.8` and the build script refuses anything else
          # with "Go 1.25.8 is required, found ... in ...". Reading the version
          # from go.mod rather than repeating it here means the two cannot drift.
          go-version-file: go.mod
          cache: true

      - name: the render needs a private view of /
        # scripts/build-deb.sh renders the two documents through bwrap so the
        # rendering is for the INSTALLED layout, and it refuses to build without
        # it rather than rendering for the wrong paths.
        #
        # bwrap needs a user namespace, and this runner does not grant an
        # unprivileged one -- measured, not assumed: the first run of this workflow
        # failed with `bwrap: setting up uid map: Permission denied` and then
        # `mosdns-cdnctl render refused`. The development machine runs the same
        # build with the same restriction set to 1 and bwrap works there, so
        # "the runner allows one" was a guess and it was wrong.
        #
        # So this DETECTS, REPAIRS, and then VERIFIES, in that order, and each
        # repair is tried only if bwrap still fails. The verification is the point:
        # a step that installs bubblewrap and moves on reports success on a runner
        # where the build is still going to fail three steps later.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap

          echo "apparmor module: $( [ -d /sys/module/apparmor ] && echo loaded || echo absent )"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          if unshare -Ur true 2>/dev/null; then
            echo "unprivileged user namespace: works"
          else
            echo "unprivileged user namespace: refused"
          fi

          works() { bwrap --ro-bind / / --chdir / /bin/true >/dev/null 2>&1; }

          if ! works; then
            echo "--- bwrap refused; lifting the AppArmor restriction on unprivileged user namespaces"
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            works || {
              echo "--- still refused; granting bwrap an AppArmor profile that allows userns"
              printf '/usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' \
                | sudo tee /etc/apparmor.d/bwrap-userns-allow >/dev/null
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-allow || true
              works || {
                echo "bwrap cannot create a user namespace on this runner, and this build"
                echo "refuses to render documents for the wrong layout. Failing here is the"
                echo "honest outcome; the fix is a runner with user namespaces, not a skip."
                bwrap --ro-bind / / --chdir / /bin/true || true
                exit 1
              }
            }
          fi
          echo "bwrap: works"

      - name: gates that are green on a clean checkout
        run: |
          set -euo pipefail
          # gofmt over `git ls-files` rather than over `.`, because `.` also walks
          # whatever build cache a developer left in the tree.
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          go test ./...

      - name: the build carries its identity
        # A build that injects no metadata ships a router that reports
        # dev/unknown/unknown, and that is indistinguishable from a build that was
        # never the reviewed one. This is `make verify-build-info`.
        run: make verify-build-info

      - name: the resolver source the build refuses to fetch for itself
        # scripts/build-deb.sh does NOT download the dnscrypt-proxy archive. It
        # checks for one and, finding none, prints the curl command to seed it and
        # exits. That is the right shape for a script that must not silently reach
        # the network, and it means a clean runner has to be seeded before the build
        # can start. This step is the seeding; it is not a second source of trust.
        #
        # The version and the URL are read out of the build script rather than
        # written here, so the two cannot drift, and the URL is assembled with the
        # same variable the script declares.
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^DNSCRYPT_VERSION=//p' scripts/build-deb.sh)
          url=$(sed -n 's|^DNSCRYPT_SOURCE_URL=||p' scripts/build-deb.sh)
          test -n "$ver" && test -n "$url"
          url=${url//\$DNSCRYPT_VERSION/$ver}
          echo "seeding $url"
          mkdir -p build
          curl -fsSL --retry 3 -o "build/dnscrypt-proxy-${ver}.tar.gz" "$url"
          # The pin file documents that it is meant for exactly this command, and
          # running it here means the log names the digest that was expected rather
          # than leaving the failure inside the build script. The build script
          # verifies the same archive again before it extracts anything; this is
          # the earlier of the two checks, not the only one.
          (cd build && sha256sum -c ../packaging/debian/dnscrypt-proxy.sha256)

      - name: the package
        # The archive is downloaded above and verified against
        # packaging/debian/dnscrypt-proxy.sha256 by the build script itself before
        # anything is built from it.
        run: sh scripts/build-deb.sh

      - name: the package says what it must say
        # The assertions live in scripts/assert-deb.sh rather than here, because
        # publish-release.yml has to run the SAME ones against a package it did not
        # build. A publish step that re-checks nothing republishes whatever it is
        # handed, and a second copy of these checks would drift from the first --
        # and the copy that drifts is the one nobody edits.
        run: |
          set -euo pipefail
          deb="build/mosdns-router_$(sed -n 's/^PACKAGE_VERSION=//p' scripts/build-deb.sh)_amd64.deb"
          sh scripts/assert-deb.sh "$deb"
          sha256sum "$deb"
          dpkg-deb --info "$deb" | sed -n '1,12p'

      - name: the package, as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: mosdns-router-deb
          path: build/*.deb
          if-no-files-found: error

      # Runs LAST, so the assertions above gate it: a release is the one artifact
      # somebody installs without reading a log, and it must not exist for a build
      # whose version, conffiles or loopback assertions failed.
