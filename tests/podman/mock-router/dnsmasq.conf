# The mock DHCP/DNS router's configuration.
#
# Copied into the mock-router image at `/etc/dnsmasq.conf` and started with
# `dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq.conf`, so this file is
# the whole of the router's configuration and nothing in the checkout changes it
# at run time.
#
# ## Why the configurable DNS lives in a *second* file
#
# The plan's Task 3 says a control command "rewrites only the container-private
# dnsmasq config, sends HUP". **Measured on this host, in `dnsmasq(8)`'s own
# NOTES section:**
#
#     When it receives a SIGHUP, dnsmasq clears its cache and then re-loads
#     /etc/hosts and /etc/ethers and any file given by --dhcp-hostsfile,
#     --dhcp-hostsdir, --dhcp-optsfile, --dhcp-optsdir, --addn-hosts or
#     --hostsdir.  ...  SIGHUP does NOT re-read the configuration file.
#
# So rewriting *this* file and sending SIGHUP changes nothing, and a scenario
# built that way would report the stale baseline it already had as a pass. What
# SIGHUP does re-read is `--dhcp-optsfile`, and `--dhcp-optsfile` takes
# precedence over `dhcp-option` ("If a DHCP client sends a DHCPREQUEST, dnsmasq
# looks for a matching DHCP option in this file and sends it in the reply. If a
# option is not found in this file, dnsmasq checks the dhcp-option configuration
# for the network"). That is the file a scenario rewrites: it is declared here,
# it lives inside the container, and it does not exist in the checkout.
#
# The file is written by `tests/podman/scenarios/dhcp_test.py`, one line per
# option, as the text to the right of `=` in `--dhcp-option`:
#
#     6,10.89.0.20
#
# and the *image* creates it with the baseline address, so option 6 has exactly
# one source. Two sources make dnsmasq say so -- measured on the first live
# 22.04 cell, the log carried `Ignoring duplicate dhcp-option 6` beside the
# option it actually sent, and the line does not say which of the two it
# ignored. That log is the document the DHCP scenario records as the
# attribution for a DNS address, so anything ambiguous in it is something a
# reader has to resolve before they can read the rest.
#
# So this file does **not** set `option:dns-server` itself. dnsmasq's own
# default for option 6 is "the address of the machine running dnsmasq" -- which
# is 10.89.0.2 here, because the router's own address is 10.89.0.2 -- so the
# baseline would be right either way; the image writes it into the option file
# rather than leaning on a default, because a value a test asserts should be one
# the harness wrote down rather than one a future dnsmasq release decides.

# Only the run's own bridge, and bound to it.
#
# `interface=eth0` is the container's own interface on the run's netavark bridge.
# A dnsmasq that listened on every address would also listen on the container's
# loopback, and a DHCP server that answers for a network it is not on is worse
# than one that answers for none.
#
# `bind-dynamic` rather than `bind-interfaces`: both bind exclusively to the
# interfaces named above ("DHCP, sockets bound exclusively to interface eth0" in
# the log), and `bind-dynamic` re-reads the interface list when an interface
# appears, where `bind-interfaces` fails to start if the interface is not yet up.
# A container's eth0 is created before the container's init runs, so both work
# here -- and the dynamic one is the answer that does not depend on that
# ordering being true.
interface=eth0
bind-dynamic

# Port 53, inside the container's own network namespace.
#
# The container has its own netns, so this binds nothing on the host: the host's
# port 53 is `systemd-resolved`'s and this container is not on the host's
# network. Publishing the port -- `podman run -p` -- would be a different
# statement, and `tests/podman/lib/podman.py` refuses it in every spelling
# precisely because that is the one way this mock router could reach the
# operator's resolver.
port=53

# No forwarding, and no reading of the host's resolution state.
#
# `no-resolv` ignores the `resolv.conf` podman generates -- which points at the
# bridge gateway -- and `no-hosts` ignores `/etc/hosts`. A mock router that
# forwarded would answer a test's questions from off this host, and a question
# answered by the host's resolver is a question the harness is not measuring.
# `no-resolv` also prints "warning: no upstream servers configured", which is
# the correct state for a mock and is left in the log rather than silenced: a
# warning that is expected should look expected.
no-resolv
no-hosts

# One name this router answers for itself, and why it is here.
#
# `no-resolv` with no upstream means dnsmasq SERVFAILs every query, and a
# SERVFAIL for the installer's own probe name (`install-probe.example`) is a
# *correct* answer from a resolver that reached nobody -- which is exactly what
# `emergency_rollback` checks for at the end of a restore, and exactly what it
# reported. Measured on a real 24.04 target in Task 8's container run, the first
# unattended rollback said:
#
#   watchdog: the window was reached: 2 consecutive failures, and the threshold
#   is 2. This run performed the emergency rollback unattended and IT FAILED:
#   ... exited 6, which is a restore was attempted and did not finish: ... a
#   query for install-probe.example through 127.0.0.53 did not resolve, so this
#   machine still cannot resolve
#
# **The watchdog was right and the fixture was wrong.** The restore did put the
# machine's own resolvers back, and the machine still could not resolve, because
# those resolvers are this mock and this mock answered nothing. A scenario cannot
# show "the machine is usable again" against a resolver that cannot resolve, and
# the fix belongs in the fixture rather than in the claim.
#
# `address=` and not `server=`: this is an answer dnsmasq gives without asking
# anybody, for one test-only name, and it is deliberately narrow -- one name,
# under a TLD nothing delegates -- so nothing here can make the mock look like a
# resolver for the rest of the matrix.
address=/install-probe.example/10.89.0.2

# The pool, and the plan's router option.
#
# 10.89.0.100-10.89.0.199 is the plan's range, and the four fixed addresses
# (10.89.0.2 router, 10.89.0.10 target, 10.89.0.20 mock CDN, 10.89.0.30 client)
# are all **below** it. The gap is the mechanism: it is what lets the scenario
# say "this address is one the pool could have handed out, so DHCP gave it" while
# the address podman handed the container is still there to be confused with.
# Overlap the two and the claim is unfalsifiable.
#
# A five-minute lease so a scenario that re-runs the transaction does not have
# to wait for a renewal: the harness re-activates the profile instead, which is
# a fresh DISCOVER rather than a renewal of the old lease.
dhcp-range=10.89.0.100,10.89.0.199,255.255.255.0,5m
dhcp-option=option:router,10.89.0.2
dhcp-leasefile=/var/lib/mosdns-mock-router/dnsmasq.leases

# The file a reload rewrites, and the one SIGHUP re-reads. See the note at the
# top of this file; this line is the other half of the mechanism, and a control
# command that wrote anywhere else would be writing a file nothing reads.
dhcp-optsfile=/etc/dnsmasq-dhcp-opts

# Authoritative, or a DISCOVER is answered with an offer of nothing and the
# client waits out its 45-second transaction for a server standing right there.
dhcp-authoritative

# The log is the attribution.
#
# `log-dhcp` records DISCOVER, OFFER, REQUEST, ACK and every option the server
# sent, which is how the scenario proves *the router* handed out the address and
# the resolver rather than inferring it from the target. `log-facility=-` sends
# it to stderr rather than to syslog, because a container has no syslog to write
# to and `podman logs` is what the harness reads. With the default facility the
# log is empty and the scenario has nothing to check -- which is what the first
# version of this measurement did: an exchange that plainly happened and no
# record of it.
log-dhcp
log-facility=-
