# Make this target's interface managed by NetworkManager.
#
# NetworkManager ships this by default, in
# /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf, and it is
# identical on 22.04 and 26.04:
#
#     [keyfile]
#     unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma
#
# So every device that is not a radio is unmanaged unless something manages it.
# On 24.04 and 26.04 a container's `eth0` on a bridge network is managed anyway;
# on **22.04 it is not**, and the `device set … managed yes` + restart sequence
# cannot make it so, because NetworkManager 1.36 has no persistent device
# override: the command is accepted, the audit log records
# `op="device-managed" … result="success"`, and the field stays `no` after the
# restart. Measured on this host; see the plan's architecture note for the
# five-point version table.
#
# One qualification, because the obvious way to check this is misleading. On
# 22.04 `/run/NetworkManager/devices/<ifindex>` *does* grow a `managed=true` key
# once the device is managed -- but that is NetworkManager recording the state it
# already has, not the command's input being re-read. With the declaration
# removed, the command is accepted, the restart happens, the field stays `no` and
# no `managed=true` key appears at all. So the discriminator is the field, and the
# key is only ever a consequence.
#
# `except:interface-name:eth0` is NetworkManager's own documented key for "this
# matched device is handled by NetworkManager even when it would not otherwise
# be". The list is repeated in full rather than only the new exception, so this
# file narrows the shipped default instead of replacing it: every other device in
# the container is left exactly as the distribution intends.
#
# **It is a baseline, not a proof.** The image's setup script asserts
# `GENERAL.NM-MANAGED: yes` after this and refuses to boot if the field is not
# `yes`, so a declaration that is written, read, and does not take effect still
# fails the boot rather than handing an unmanaged device to a scenario. That
# check is what keeps this file honest, and a case in
# tests/podman/tests/test_images.py holds it.

[keyfile]
unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma,except:interface-name:eth0
